[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-log-traffic-analyzer"
version = "1.0.0"
description = "Professional CLI tool for network and firewall traffic log analysis"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["network", "security", "logs", "firewall", "traffic-analysis", "cli", "linux"]
license = {text = "MIT"}

[project.scripts]
netlog-traffic = "network_log_traffic_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
